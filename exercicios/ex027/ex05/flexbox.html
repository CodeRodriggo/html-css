<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>

    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            background-color: blanchedalmond;
        }
        main{
            display: flex;
            background-color: lightcoral;
            height: 100px;
            align-items: center;
            justify-content: center;

        }
        
        section{
            display: flex;
            background-color: lightblue;
            width: 50px;
            align-items: center;
            justify-content: center;
               
        }

        section > h1{
            padding: 15px;
            font-size: 20px;
        }
    </style>

</head>
<body>
    <main>
        <section>
            <h1> BOX </h1>
        </section>
    </main>
</body>
</html>
