<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex box</title>
    <style>

          *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
          }

        .container1{
            display: flex;
            background-color: lightcoral;
            justify-content: space-between;
            height: 100px;
            align-items: center;
            border: solid 1px black;
            
            
        }

        .container1 > div {
            display: flex;
            background-color: lightgreen;
            border: 1px solid black;
            width: 30px;
            align-items: center;
            justify-content: center;
            height: 40px;
            margin: 0 5px;

        }

        .container2{
            display: flex;
            background-color: lightseagreen;
            justify-content: center;
            height: 100px;
            margin-top: 20px;
            align-items: center;
            border: solid 1px black;

        }

        .container2 > div{
            display: flex;
            background-color: lightpink;
            justify-content: center;
            align-items: center;
            border: solid 1px black;
            width: 40px;
            height: 40px;
        }
    </style>
</head>
<body>

    <div class="container1">
        <div> A</div>
        <div> B </div>
        <div> C </div>
        <div> D </div>
        <div> E </div>
        <div> F </div>

    </div>


    <div class="container2">
        <div> A</div>

    </div>
    
</body>
</html>
