<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex box</title>
    <style>

          *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
          }

        .container{
            display: flex;
            background-color: lightcoral;
            /* flex-wrap: wrap;
            flex-direction: row; */
            flex-flow: wrap row; /*combinação de flex-wrap e flex-direction*/

        }

        .container > div {
            display: flex;
            background-color: lightgreen;
            padding: 10px 5px;
            border: 1px solid black;
            align-items: center;
            height: 70px;

        }

    </style>
</head>
<body>

    <div class="container">
        <div><p>EXEMPLO A</p></div>
        <div><p>EXEMPLO B</p> </div>
        <div><p>EXEMPLO C</p> </div>
        <div><p>EXEMPLO D</p> </div>
        <div><p>EXEMPLO E</p> </div>
        <div><p>EXEMPLO F</p></div>

    </div>
    
</body>
</html>
