<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flexbox - flex-bases</title>
    <style>

        .container{
            display: flex;
            background-color: lightcoral;
            flex-flow: row wrap;
            height: 400px;
            align-items: flex-start;
            
        }

        .item{
            background-color: rgb(169, 227, 169);
            padding: 20px;
            border: 1px solid black;
            
        }

       #i1{
        align-self: center;
       }

       #i2{
        align-self:stretch;
       }

       #i3{
        align-self: center;
        }

       #i4{
        align-self: flex-end;
       }

        #i5{
            align-self: auto;
       }

       #i6{
        align-self: center;

       }
    </style>
</head>
<body>

    <div class="container">
        <div class="item" id="i1">A</div>
        <div class="item" id="i2">B</div>
        <div class="item" id="i3">C</div>
        <div class="item" id="i4">D</div>
        <div class="item" id="i5">E</div>
        <div class="item" id="i6">F</div>

    </div>
    
</body>
</html>
