<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex box</title>
    <style>

        .container{
            display: flex;
            background-color: lightcoral;
        }

        .container > div {
            background-color: lightgreen;
            padding: 10px;
            flex: auto;
            border: 1px solid black;
            text-align: center;
            
        }

    </style>
</head>
<body>

    <div class="container">
        <div>A</div>
        <div>B</div>
        <div>C</div>
        <div>D</div>
        <div>E</div>
        <div>F</div>

    </div>
    
</body>
</html>
