<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>using flex:</title>
    <style>

        .container{
            display: flex;
            background-color: lightcoral;
        }

        .container > div {
            background-color: lightgreen;
            border: 1px solid black;
            text-align: center;
  
        }

        /*flex: 0 0 0px  { [é a combinação de flex-grow + flex-shrink + flex-basis] Essa propriedade é usada apenas na DIV filho*/
        
       div#a1{
    /*  flex-grow: 1;
        flex-shrink: 2;
        flex-basis: 250px; 
    */


        flex: 1 1 250px;
        /*simplidicado*/
       }  

        div#b1{
    /*  flex-grow: 3;
        flex-shrink: 0;
        flex-basis: 250px; 
    */
      
        
        flex: 3 0 250px;
        /*simplidicado*/
       } 

       div#c1{
    /*  flex-grow: 0;
        flex-shrink: 4;
        flex-basis: 250px; 
    */


        flex: 0 4 250px;
        /*simplidicado*/
       }  

    </style>
</head>
<body>

    <div class="container">
        <div id="a1">A</div>
        <div id="b1">B</div>
        <div id="c1">C</div>
        
    </div>
    
</body>
</html>
